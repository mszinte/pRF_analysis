# ------------- Main configuration -------------------
analysis_task_names:
  description: "Names of the tasks analysed with nCSF methods"
  value: ["nCSF"]

TR: 
  description: "Time repetition of the pRF tasks"
  unit: "seconds"
  value: 1.6

TRs: 
  description: "Number of TR of the analysed task"
  value: 156

output_folder: 
  description: "Name of the folder created to save the outputs of the prfmodel nCSF fit (ncsf_fit_gpu.py); the prfpy_csenf fit (ncsf_fit.py) and the postfit scripts use 'ncsf' (hard-coded)"
  value: "ncsf_prfmodel"

nCSF_session: 
  description: "session of nCSF task"
  value: "ses-01"
 
ncsf_n_runs:
  description: "number of run for nCSF task"
  value: 10

sf_minFreq:
  description: "lowest spatial frequency"
  value: 0.05

sf_maxFreq:
  description: "highest spatial frequency"
  value: 16

sf_filtNum:
  description: "number of spatial frequency"
  value: 6

sf_filtOverlap:
  description: "proportion of overlap between gaussian filter"
  value: 0.6

minCont:
  description: "lowest contrast in % Michelson contrast"
  value: 0.25

maxCont:
  description: "highest contrast in % Michelson contrast"
  value: 80

contNum:
  description: "number of contrast steps"
  value: 12

ncsf_grid_nr:
  description: "number of steps for nCSH gridfit"
  value: 10

ncsf_iterative_rsq_threshold:
  description: "rsq threshold for nCSF iterative fit"
  value: 0.1

maps_names_ncsf:
  description: "map names for nCSF fit object"
  value: ['width_r', 'SFp', 'CSp', 'width_l', 'crf_exp', 'amp_1', 'bold_baseline', 'hrf_1', 'hrf_2', 'ncsf_rsq', 'auc', 'normalize_auc', 'SFmax']

maps_names_ncsf_stats: 
  description: "nCSF stats maps names of gifti files"
  value: ["slope", "intercept", "rvalue", "pvalue", "stderr", "trs", "corr_pvalue_5pt", "corr_pvalue_1pt"]

run_ncsf_fit_on_rois:
  description: "Run nCSF fit only on roi (True) or on full brain (False)"
  value: True

avg_methods: 
  description: "Name of the averaging of the data fitted with nCSF (also defined in prf-analysis.yml, this value is used)"
  value: ["avg", "loo-avg"]
  levels: ["avg", "loo-avg", "concat", "runs"]

# -------------  prfmodel GPU fit (ncsf_fit_gpu.py) -------------
ncsf_formats_to_fit:
  description: "Data formats submitted by submit_ncsf_jobs_gpu.py"
  value: ["fsnative"]
  levels: ["fsnative", "170k"]

ncsf_fit_width_l:
  description: "Fit the left-branch width of the CSF (True, as prfpy_csenf) or fix it to ncsf_width_l (False, prfmodel default)"
  value: False

ncsf_width_l:
  description: "Fixed left-branch width of the CSF when ncsf_fit_width_l is False (prfmodel default 0.68)"
  value: 0.68

ncsf_weight_deriv:
  description: "Fixed weight of the HRF temporal derivative (prfmodel DerivativeTwoGammaImpulse)"
  value: -0.5

ncsf_grid:
  description: "Grid search values [min, max, number of steps], log-spaced (np.geomspace). width_l is used only if ncsf_fit_width_l is True"
  value:
    cs_peak: [1.25, 400, 12]
    sf_peak: [0.1, 10, 12]
    width_l: [0.3, 1.5, 3]
    width_r: [0.3, 2, 6]
    slope_crf: [0.5, 8, 8]

ncsf_bounds:
  description: "Open bounds [lower, upper] of the CSF parameters during SGD (bounded_transform of prfmodel_utils.py). The grid must lie strictly inside, away from the bounds"
  value:
    cs_peak: [1, 500]
    sf_peak: [0.05, 16]
    width_l: [0.1, 3]
    width_r: [0.1, 3]
    slope_crf: [0.2, 10]

ncsf_grid_batch_size:
  description: "Number of vertices per batch of the grid search (lower it if the GPU runs out of memory)"
  value: 100

ncsf_max_sfmax:
  description: "Upper limit of the SFmax derivative"
  unit: "cycles/deg"
  value: 50

sgd_num_steps:
  description: "Number of SGD steps"
  value: 1000

sgd_learning_rate:
  description: "Adam learning rate of the SGD fit"
  value: 0.01

#  -----------  ROIS -----------
rois_methods:
  description: "Method use to define ROIS, defined for each format"
  value: 
    fsnative: ["rois-group-mmp"]
    170k: ["rois-group-mmp"]
  levels: ["rois-drawn", "rois-group-mmp"]
  level-description: 
    rois-drawn: "ROIs hand-drawn using Inskape as defined in rois-drawn (see below)"
    rois-group-mmp: "ROIS based on grouped mmp glasser atlas parcelations as defined in rois_mmp_groups (see below)"
